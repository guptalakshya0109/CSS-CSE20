<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Card Demo</title></head>
<body>
  <header class="site-header">
    <h1>ShopEasy</h1>
  </header>

  <main class="container">
    <section class="product-card">
      <img class="product-image" src="tshirt.jpg" alt="Product image">
      <div class="product-title">Classic Cotton T-Shirt</div>
      <div class="product-desc">Soft, breathable comfartable cotton. Regular fit. Available in multiple colors.</div>

      <div class="price-row">
        <div class="price">₹1,499</div>
        <div class="old-price">₹2,199</div>
      </div>

      <button class="add-cart">Add to Cart</button>
    </section>
  </main>
</body>
</html>
