<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Card Demo</title>
</head>
<body>
<header class="site-header">
<h1>SHOPEASY</h1>
</header>
<main class="container">
<section class="product-card">
<img src="tshirt.jpg" alt="Product image">
<div class="product-title">Classic Cotton T-shirt</div>
<div class="product-desc">Soft , Comfortable cotton , Regular Fit , Breathable , Available in multicolour .</div>
<div class="price-row">
<div class="price">1499</div>
<div class="old-price">2499</div>
</div>
<button class="add-cart">Add to cart</button>
</section>
</main>
</body>
</html>
